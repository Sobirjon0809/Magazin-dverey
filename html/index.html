<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
    <title>Магазин Дверей</title>
</head>

<body>
    <header>
        <div class="container">
            <div class="header__logo">
                <img src="../images/header-logo.svg" alt="дверЬ.рф logo">
            </div>
            <div class="header__text">
                <p>Межкомнатные, входные двери и фурнитура к ним</p> <!-- Tarjimasi : Ichki eshiklar, tashqi (kirish) eshiklar va ularga tegishli jihozlar-->
            </div>
            <div class="header__location">
                <div class="header__location-logo">
                    <img src="../images/location.svg" alt="Volgograd location logo">
                </div>
                <div class="header__location-s">
                    <span class="header__location-1">г. Волгоград</span> <!-- Tarjimasi : Volgograd shahri -->
                    <span class="header__location-2">ул. Каннуникова д 6/1</span> <!-- Tarjimasi : Kаннуникова ko'chasi, 6/1-uy -->
                </div>
            </div>
            <div class="header__cont">
                <div class="header__cont-logo">
                    <img src="../images/header__cont-logo.svg" alt="telefon logo">
                </div>
                <div class="header__cont-text">Звоните прямо сейчас:</div> <!-- Tarjimasi : Hozir qo'ng'iroq qiling -->
                <div class="header__cont-num">+7 (844) 225-03-00</div>
            </div>
        </div>
    </header>



    <script src="script.js"></script>
</body>

</html>
